apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: marwan774/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: PORT
              value: "4003"
            - name: MONGO_URI
              value: mongodb://mongo:27017/order_db
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:4002
            - name: RABBITMQ_URL
              value: amqp://rabbitmq:5672
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      protocol: TCP
      port: 4003
      targetPort: 4003
