apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: marwan774/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: PORT
              value: "4001"
            - name: MONGO_URI
              value: mongodb://mongo:27017/auth_db
            - name: ADMIN_NAME
              value: Admin User
            - name: ADMIN_EMAIL
              value: admin@example.com
            - name: ADMIN_PASSWORD
              value: admin123
            - name: JWT_SECRET
              value: "smart-inventory-secret"
