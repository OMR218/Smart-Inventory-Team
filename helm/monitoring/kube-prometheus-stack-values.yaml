# ─────────────────────────────────────────────────────────────────────────────
# Smart Inventory – kube-prometheus-stack values (simplified)
# Install / upgrade:
#   helm upgrade --install kube-prometheus prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f helm/monitoring/kube-prometheus-stack-values.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  adminPassword: changeme
  # Configure Grafana to serve from a subpath (/grafana)
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      serve_from_sub_path: true

  # Configure Grafana's Ingress resource
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
    hosts:
      - ""
    path: /grafana/?(.*)
    pathType: ImplementationSpecific

  # Load our custom inventory dashboard ConfigMap from any namespace
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
  # ── Famous community dashboards imported by Grafana.com ID ──────────────
  dashboards:
    default:
      # Node Exporter Full – CPU, memory, disk, network per node
      # https://grafana.com/grafana/dashboards/1860
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      # Kubernetes Cluster Monitoring (via Prometheus)
      # https://grafana.com/grafana/dashboards/315
      kubernetes-cluster:
        gnetId: 315
        revision: 3
        datasource: Prometheus
  # Disable the bundled kube-prometheus-stack Kubernetes dashboards (noisy)
  defaultDashboardsEnabled: false
  service:
    type: NodePort
    nodePort: 30300

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 7d
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Pick up ServiceMonitors / Rules from any namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

# ── Alertmanager – Discord notifications ──────────────────────────────────────
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: discord-warning
      routes:
        # Critical alerts get an @here ping
        - matchers:
            - severity = critical
          receiver: discord-critical
    receivers:
      - name: discord-warning
        discord_configs:
          - webhook_url: "https://discord.com/api/webhooks/1523387878535729194/kXCPTQSsHz4p49AhaSSbTMANDb5roxjD8j28R5hQL4XSCjRwtk659fz_WwpvHTiSTTbt"
            title: "⚠️ [WARNING] {{ .GroupLabels.alertname }}"
            message: |
              {{ range .Alerts }}
              **{{ .Annotations.summary }}**
              {{ .Annotations.description }}
              {{ end }}

      - name: discord-critical
        discord_configs:
          - webhook_url: "https://discord.com/api/webhooks/1523387878535729194/kXCPTQSsHz4p49AhaSSbTMANDb5roxjD8j28R5hQL4XSCjRwtk659fz_WwpvHTiSTTbt"
            title: "🚨 [CRITICAL] {{ .GroupLabels.alertname }}"
            message: |
              @here
              {{ range .Alerts }}
              **{{ .Annotations.summary }}**
              {{ .Annotations.description }}
              {{ end }}

# ── Default rules – turn off ALL the noisy built-in rules ────────────────────
defaultRules:
  create: false

# ── Keep infra components enabled (they provide the metrics we query) ─────────
kube-state-metrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  enabled: true

# ── Disable control-plane monitors that are unreachable in kind clusters ──────
# In kind, kube-controller-manager, kube-scheduler, etcd and kube-proxy all
# bind to 127.0.0.1 inside the Docker container, not on the pod network, so
# Prometheus can never scrape them. Disabling them removes the 4 permanent
# "connection refused" errors from the Targets page.
kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false
